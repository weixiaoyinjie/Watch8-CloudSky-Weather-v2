name: Build Watch8 Weather v2 Three-Row APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-watch8:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source project or uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*Weather*Watch8*v2*.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::Upload CloudSky-Weather-Watch8-v2-OneUpload.zip to the repository root.'
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/watch8-weather"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/watch8-weather"
            if [[ -f "$RUNNER_TEMP/watch8-weather/settings.gradle" && -f "$RUNNER_TEMP/watch8-weather/app/build.gradle" ]]; then
              PROJECT_DIR="$RUNNER_TEMP/watch8-weather"
            fi
          fi
          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::No valid Android Gradle project found in the ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo '::error::Android SDK 35 is missing on this runner'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo '::error::Android Build Tools 35.0.0 missing'; exit 1; }
          echo 'Preinstalled SDK 35 is ready (no setup-android download).'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Watch8 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/CloudSky-Weather-Watch8-v2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSky-Weather-Watch8-v2-APK
          path: CloudSky-Weather-Watch8-v2.apk
          if-no-files-found: error
